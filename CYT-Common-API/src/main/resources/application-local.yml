# Local defaults. Keep secrets in environment variables or the ignored external properties file.
spring:
  config:
    import:
      - optional:file:./application-local.properties
      - optional:file:./CYT-Common-API/application-local.properties
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/cyt_common_api_java}
    username: ${POSTGRES_USERNAME:cyt_gateway}
    password: ${POSTGRES_PASSWORD:}

ENV: local
MOCK_ALL: true
GATEWAY_DEV_MODE: false
JAVA_SEED_ENABLED: ${MOCK_ALL:true}
