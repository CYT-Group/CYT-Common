# 应用与 SQL 镜像使用同一个 BUILD_ID；独立迁移成功后才更新 Java 服务。
steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/gcp/Dockerfile.api', '-t', '${_REGISTRY}/cyt-common-java:$BUILD_ID', '.']
  - id: build-migrations
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/gcp/Dockerfile.migrate', '-t', '${_REGISTRY}/cyt-common-migrate:$BUILD_ID', '.']
  - id: push-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker push '${_REGISTRY}/cyt-common-java:$BUILD_ID'
        docker image inspect '${_REGISTRY}/cyt-common-java:$BUILD_ID' --format '{{index .RepoDigests 0}}' > /workspace/common-api-image-digest.txt
  - id: push-migrations
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGISTRY}/cyt-common-migrate:$BUILD_ID']
  - id: configure-migration-job
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - '${_JOB_PREFIX}-$BUILD_ID'
      - '--project=$PROJECT_ID'
      - '--region=${_REGION}'
      - '--image=${_REGISTRY}/cyt-common-migrate:$BUILD_ID'
      - '--service-account=${_MIGRATION_SA}'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--vpc-egress=${_VPC_EGRESS}'
      - '--set-secrets=${_MIGRATION_SECRETS}'
      - '--tasks=1'
      - '--parallelism=1'
      - '--max-retries=0'
      - '--task-timeout=600s'
      - '--memory=512Mi'
      - '--quiet'
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args: ['run', 'jobs', 'execute', '${_JOB_PREFIX}-$BUILD_ID', '--project=$PROJECT_ID', '--region=${_REGION}', '--wait', '--quiet']
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: python3
    args:
      - deploy/gcp/release.py
      - '--project=$PROJECT_ID'
      - '--region=${_REGION}'
      - '--service=${_SERVICE}'
      - '--build-id=$BUILD_ID'
      - '--digest-file=/workspace/common-api-image-digest.txt'
      - '--secret-bindings-file=${_SECRET_BINDINGS_FILE}'
      - '--image=${_REGISTRY}/cyt-common-java:$BUILD_ID'
      - '--'
      - '--platform=managed'
      - '--service-account=${_RUNTIME_SA}'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--vpc-egress=${_VPC_EGRESS}'
      # update 保留现有服务的其他配置和挂载；不使用 set-env-vars / set-secrets 清空它们。
      - '--update-secrets=${_RUNTIME_SECRETS}'
      - '--update-env-vars=${_RUNTIME_ENV}'
      # literal 在 Secret 更新前移除，支持同名明文配置升级为 Secret。
      - '--remove-env-vars=${_REMOVE_ENV_VARS}'
      - '--remove-secrets=${_REMOVE_SECRET_VARS}'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '${_CPU_FLAG}'
      - '--timeout=300s'
      - '${_AUTH_FLAG}'
      - '--quiet'
  - id: show-service-url
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args: ['run', 'services', 'describe', '${_SERVICE}', '--project=$PROJECT_ID', '--region=${_REGION}', '--format=value(status.url)']
images:
  - '${_REGISTRY}/cyt-common-java:$BUILD_ID'
  - '${_REGISTRY}/cyt-common-migrate:$BUILD_ID'
timeout: 2400s
options:
  logging: CLOUD_LOGGING_ONLY
